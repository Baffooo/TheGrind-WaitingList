<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Grind Waiting List Multi-Artist</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Grind">
  <meta name="theme-color" content="#0a0a0a">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts Pulito e Moderno per gli Artisti -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            artist: ['Montserrat', 'sans-serif'],
            heading: ['Space Grotesk', 'sans-serif']
          },
          colors: {
            brand: {
              black: '#0a0a0a',
              card: '#121212',
              border: '#262626',
              muted: '#737373'
            },
            artist: {
              claudia: '#ec4899',
              posco: '#3b82f6',
              davide: '#f97316'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 2px;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    /* Animazione Scintilla e Saltello per il Logo Libero */
    @keyframes logoSparkleBounce {
      0% {
        transform: translateY(0) scale(1) rotate(0deg);
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.25)) brightness(1);
      }
      30% {
        transform: translateY(-14px) scale(1.1) rotate(-3deg);
        filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.8)) brightness(1.35);
      }
      60% {
        transform: translateY(-5px) scale(1.04) rotate(2deg);
        filter: drop-shadow(0 0 40px rgba(255, 255, 255, 1)) brightness(1.6);
      }
      80% {
        transform: translateY(-8px) scale(1.07) rotate(-1deg);
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6)) brightness(1.25);
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.25)) brightness(1);
      }
    }

    .logo-hover-effect:hover img,
    .logo-hover-effect:active img {
      animation: logoSparkleBounce 0.8s ease-in-out infinite alternate;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

  <!-- SCHERMATA SELEZIONE ARTISTA ALL'AVVIO -->
  <div id="artist-selector-screen" class="fixed inset-0 z-50 bg-brand-black flex flex-col items-center justify-center p-6 space-y-6">
    <div class="text-center space-y-3 max-w-sm">
      
      <!-- LOGO PIÙ GRANDE E LIBERO DA CONFINI -->
      <div class="logo-hover-effect w-40 h-40 sm:w-48 sm:h-48 mx-auto flex items-center justify-center overflow-visible cursor-pointer transition-all duration-300">
        <img src="logo.jpg" alt="Logo The Grind" class="max-w-full max-h-full object-contain transition-all duration-300">
      </div>

      <div>
        <h1 class="font-heading text-lg sm:text-xl font-black tracking-wider text-white uppercase">THE GRIND TATTOO FINEST</h1>
        <p class="text-[10px] text-brand-muted tracking-[0.25em] uppercase font-bold mt-1">PICK YOUR ARTIST</p>
      </div>
    </div>

    <!-- PULSANTI ARTISTI COMPATTI E CENTRATI -->
    <div class="w-full max-w-xs space-y-3">
      <button onclick="selectArtist('claudia')" class="w-full py-3.5 px-5 rounded-2xl bg-brand-card border border-pink-500/30 hover:border-pink-500 hover:bg-pink-500/10 hover:scale-[1.03] hover:shadow-[0_0_25px_rgba(236,72,153,0.25)] flex items-center justify-between transition-all duration-300 active:scale-95 group cursor-pointer">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-pink-500 shadow-[0_0_10px_#ec4899] shrink-0"></div>
          <span class="font-artist font-bold text-white text-sm tracking-wide group-hover:text-pink-400 transition-colors">Claudia Bindi</span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-pink-500 transform group-hover:translate-x-1 transition-transform shrink-0"></i>
      </button>

      <button onclick="selectArtist('posco')" class="w-full py-3.5 px-5 rounded-2xl bg-brand-card border border-blue-500/30 hover:border-blue-500 hover:bg-blue-500/10 hover:scale-[1.03] hover:shadow-[0_0_25px_rgba(59,130,246,0.25)] flex items-center justify-between transition-all duration-300 active:scale-95 group cursor-pointer">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6] shrink-0"></div>
          <span class="font-artist font-bold text-white text-sm tracking-wide group-hover:text-blue-400 transition-colors">Posco Losco</span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-blue-500 transform group-hover:translate-x-1 transition-transform shrink-0"></i>
      </button>

      <button onclick="selectArtist('davide')" class="w-full py-3.5 px-5 rounded-2xl bg-brand-card border border-orange-500/30 hover:border-orange-500 hover:bg-orange-500/10 hover:scale-[1.03] hover:shadow-[0_0_25px_rgba(249,115,22,0.25)] flex items-center justify-between transition-all duration-300 active:scale-95 group cursor-pointer">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-orange-500 shadow-[0_0_10px_#f97316] shrink-0"></div>
          <span class="font-artist font-bold text-white text-sm tracking-wide group-hover:text-orange-400 transition-colors">Davide Saba</span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-orange-500 transform group-hover:translate-x-1 transition-transform shrink-0"></i>
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-brand-black/95 backdrop-blur-md border-b border-brand-border px-4 py-3 flex justify-between items-center gap-2">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <div class="w-10 h-10 rounded-lg bg-black border border-brand-border p-1 flex items-center justify-center shrink-0 overflow-hidden">
        <img src="logo.jpg" alt="Logo" class="max-w-full max-h-full object-contain">
      </div>
      <div class="truncate">
        <div onclick="openArtistSelectionScreen()" class="flex items-center gap-1.5 cursor-pointer group" title="Clicca per cambiare artista">
          <h1 id="artist-title" class="font-artist font-bold text-sm tracking-wider text-white uppercase leading-none truncate group-hover:underline">CLAUDIA BINDI</h1>
          <i data-lucide="repeat" class="w-3 h-3 text-brand-muted group-hover:text-white shrink-0"></i>
        </div>
        <h2 class="text-xs font-bold tracking-widest text-neutral-300 uppercase leading-tight mt-0.5 truncate">WAITING LIST</h2>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0 z-10">
      <button type="button" id="voice-btn" onclick="startVoiceRecognition(event)" class="p-2.5 rounded-full bg-brand-card border border-brand-border text-white hover:border-white transition-all active:scale-95 relative cursor-pointer" title="Comando Vocale">
        <i data-lucide="mic" class="w-5 h-5 pointer-events-none"></i>
        <span id="voice-pulse" class="hidden absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full animate-ping pointer-events-none"></span>
      </button>
      <button type="button" onclick="openModal(false)" id="btn-new-client" class="px-3.5 py-2 rounded-full text-black font-semibold text-sm transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer">
        <i data-lucide="plus" class="w-4 h-4 pointer-events-none"></i> Nuovo
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">

    <div class="flex justify-between items-center text-xs px-1 text-brand-muted">
      <span id="status-indicator">Inizializzazione...</span>
      <span>Priorità: ASAP > Relax</span>
    </div>

    <!-- RICERCA E FILTRI -->
    <div class="space-y-2">
      <div class="relative w-full">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-brand-muted"></i>
        <input type="text" id="search-input" oninput="renderList()" placeholder="Cerca cliente o note..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-white">
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div class="flex gap-1">
          <select id="filter-location" onchange="renderList()" class="bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white w-full truncate">
            <!-- Popolato Dinamicamente -->
          </select>
          <button onclick="openManageLocationsModal()" class="p-2 bg-brand-card border border-brand-border rounded-xl text-brand-muted hover:text-white transition-all shrink-0 cursor-pointer" title="Gestisci Luoghi">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>

        <select id="filter-priority" onchange="renderList()" class="bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white w-full truncate">
          <option value="ALL">Tutte le Tipologie</option>
          <option value="1">Continuo – ASAP</option>
          <option value="2">Nuovo – ASAP</option>
          <option value="3">Continuo – Relax</option>
          <option value="4">Nuovo – Relax</option>
          <option value="ALL_CONTINUO">Tutti i Continui</option>
          <option value="ALL_NUOVO">Tutti i Nuovi</option>
          <option value="EVENT">Iscrizioni Eventi</option>
        </select>
      </div>
    </div>

    <div id="client-list" class="space-y-3"></div>

    <div id="empty-state" class="hidden py-16 text-center space-y-3">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto text-brand-muted stroke-1"></i>
      <p class="text-brand-muted text-sm">Nessun cliente presente in questa lista d'attesa.</p>
    </div>

  </main>

  <!-- MODALE FORM CLIENTE -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex justify-between items-center border-b border-brand-border pb-3">
        <h2 id="modal-title" class="text-lg font-bold text-white uppercase tracking-wider">Nuovo Cliente</h2>
        <button type="button" onclick="closeModal()" class="text-brand-muted hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5 pointer-events-none"></i>
        </button>
      </div>

      <form id="client-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="field-id">

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Nome Cliente *</label>
          <input type="text" id="field-name" required placeholder="Es. Mario Rossi" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Contatto (Telefono) *</label>
          <input type="tel" id="field-contact" required placeholder="Es. +39 333 1234567" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Luogo *</label>
          <select id="field-location" required onchange="handleLocationChange()" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
            <!-- Popolato Dinamicamente -->
          </select>
        </div>

        <div id="priority-container">
          <label class="block text-xs font-medium text-brand-muted mb-1">Tipo Progetto & Priorità *</label>
          <select id="field-priority" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
            <option value="1">Continuo Progetto – Prima possibile (Rank 1)</option>
            <option value="2">Nuovo Tatuaggio – Prima possibile (Rank 2)</option>
            <option value="3">Continuo Progetto – Senza fretta (Rank 3)</option>
            <option value="4">Nuovo Tatuaggio – Senza fretta (Rank 4)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Data Inserimento *</label>
          <input type="date" id="field-date" required class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Note</label>
          <textarea id="field-notes" rows="3" placeholder="Dettagli progetto, zona corpo, orari..." class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-brand-border text-brand-muted hover:text-white font-medium text-sm transition-all">Annulla</button>
          <button type="submit" id="btn-save-modal" class="flex-1 py-2.5 rounded-xl text-black font-semibold text-sm transition-all">Salva Cliente</button>
        </div>
      </form>

    </div>
  </div>

  <!-- MODALE GESTIONE LUOGHI -->
  <div id="locations-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex justify-between items-center border-b border-brand-border pb-3">
        <h2 class="text-base font-bold text-white uppercase tracking-wider">Gestione Luoghi</h2>
        <button type="button" onclick="closeManageLocationsModal()" class="text-brand-muted hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="new-location-name" placeholder="Nuovo Luogo..." class="flex-1 bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        <label class="flex items-center gap-1.5 text-xs text-brand-muted px-2 border border-brand-border rounded-xl bg-brand-black cursor-pointer">
          <input type="checkbox" id="new-location-single-priority" class="rounded"> Single Rank
        </label>
        <button onclick="addCustomLocation()" id="btn-add-loc" class="px-3 py-2 rounded-xl text-black font-semibold text-xs transition-all">Aggiungi</button>
      </div>

      <div id="locations-list" class="space-y-2 pt-2"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const ARTISTS_CONFIG = {
      claudia: {
        id: 'claudia',
        name: 'Claudia Bindi',
        color: '#ec4899',
        defaultLocations: [
          { name: 'The Grind', isSinglePriority: false },
          { name: 'Milano City Ink', isSinglePriority: false },
          { name: 'Roma', isSinglePriority: false },
          { name: 'Pordenone', isSinglePriority: false },
          { name: 'Convention', isSinglePriority: true },
          { name: 'Seminario Cla', isSinglePriority: true },
          { name: 'Seminario Pos', isSinglePriority: true }
        ]
      },
      posco: {
        id: 'posco',
        name: 'Posco Losco',
        color: '#3b82f6',
        defaultLocations: [
          { name: 'Seminari', isSinglePriority: true },
          { name: 'Tele per seminari', isSinglePriority: true }
        ]
      },
      davide: {
        id: 'davide',
        name: 'Davide Saba',
        color: '#f97316',
        defaultLocations: [
          { name: 'Alghero', isSinglePriority: false },
          { name: 'Cagliari', isSinglePriority: false },
          { name: 'The Grind', isSinglePriority: false },
          { name: 'Milano City Ink', isSinglePriority: false },
          { name: 'Petracore', isSinglePriority: false },
          { name: 'Convention', isSinglePriority: true }
        ]
      }
    };

    let currentArtistId = localStorage.getItem('selected_artist_id') || null;

const firebaseConfig = {
  apiKey: "AIzaSyDccFCqeRlOxyR9SkHGYBKVkruL4XOA1SQ",
  authDomain: "thegrind-waitinglist.firebaseapp.com",
  projectId: "thegrind-waitinglist",
  storageBucket: "thegrind-waitinglist.firebasestorage.app",
  messagingSenderId: "977596767778",
  appId: "1:977596767778:web:24202c4d719a2f7e14f47b",
  measurementId: "G-L2SMGSKYFV"
};


    let db = null;
    let useLocalStorage = false;
    let clientsData = [];
    let customLocations = JSON.parse(localStorage.getItem('custom_artist_locations')) || {};

    try {
      if (firebaseConfig.apiKey !== "INSERISCI_LA_TUA_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        document.getElementById('status-indicator').innerText = "Cloud Sync (Firebase)";
        initFirebaseListener();
      } else {
        throw new Error("Firebase non configurato, proseguo in locale.");
      }
    } catch (e) {
      useLocalStorage = true;
      document.getElementById('status-indicator').innerText = "Modalità Locale (LocalStorage)";
      loadFromLocalStorage();
    }

    if (!currentArtistId) {
      openArtistSelectionScreen();
    } else {
      document.getElementById('artist-selector-screen').classList.add('hidden');
      applyArtistTheme(currentArtistId);
    }

    function selectArtist(artistId) {
      currentArtistId = artistId;
      localStorage.setItem('selected_artist_id', artistId);
      document.getElementById('artist-selector-screen').classList.add('hidden');
      applyArtistTheme(artistId);
      renderList();
    }

    function openArtistSelectionScreen() {
      document.getElementById('artist-selector-screen').classList.remove('hidden');
    }

    function applyArtistTheme(artistId) {
      const config = ARTISTS_CONFIG[artistId];
      if (!config) return;

      document.getElementById('artist-title').innerText = config.name.toUpperCase();
      document.documentElement.style.setProperty('--artist-color', config.color);

      const btnNew = document.getElementById('btn-new-client');
      const btnSave = document.getElementById('btn-save-modal');
      const btnAddLoc = document.getElementById('btn-add-loc');

      [btnNew, btnSave, btnAddLoc].forEach(btn => {
        if (btn) btn.style.backgroundColor = config.color;
      });

      populateLocationDropdowns();
    }

    function getArtistLocations() {
      if (!currentArtistId) return [];
      if (customLocations[currentArtistId]) {
        return customLocations[currentArtistId];
      }
      return ARTISTS_CONFIG[currentArtistId].defaultLocations;
    }

    function populateLocationDropdowns() {
      const locations = getArtistLocations();
      const filterLoc = document.getElementById('filter-location');
      const fieldLoc = document.getElementById('field-location');

      filterLoc.innerHTML = '<option value="ALL">Tutti i Luoghi</option>';
      fieldLoc.innerHTML = '';

      locations.forEach(loc => {
        filterLoc.innerHTML += `<option value="${escapeHtml(loc.name)}">${escapeHtml(loc.name)}</option>`;
        fieldLoc.innerHTML += `<option value="${escapeHtml(loc.name)}">${escapeHtml(loc.name)}</option>`;
      });
    }

    function initFirebaseListener() {
      db.collection("waiting_list").onSnapshot(snapshot => {
        clientsData = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderList();
      }, error => {
        console.error("Errore Firebase:", error);
        document.getElementById('status-indicator').innerText = "Errore Connessione Cloud";
      });
    }

    function loadFromLocalStorage() {
      const data = localStorage.getItem('tattoo_waiting_list');
      clientsData = data ? JSON.parse(data) : [];
      renderList();
    }

    function saveLocal() {
      if (useLocalStorage) {
        localStorage.setItem('tattoo_waiting_list', JSON.stringify(clientsData));
        renderList();
      }
    }

    async function saveClient(client) {
      client.artistId = currentArtistId;

      if (!useLocalStorage && db) {
        if (client.id) {
          const id = client.id;
          delete client.id;
          await db.collection("waiting_list").doc(id).set(client);
        } else {
          delete client.id;
          await db.collection("waiting_list").add(client);
        }
      } else {
        if (client.id) {
          const index = clientsData.findIndex(c => c.id === client.id);
          if (index !== -1) clientsData[index] = client;
        } else {
          client.id = 'local_' + Date.now();
          clientsData.push(client);
        }
        saveLocal();
      }
    }

    async function deleteClient(id) {
      if (confirm("Sei sicuro di voler rimuovere questo cliente dalla lista d'attesa?")) {
        if (!useLocalStorage && db) {
          await db.collection("waiting_list").doc(id).delete();
        } else {
          clientsData = clientsData.filter(c => c.id !== id);
          saveLocal();
        }
      }
    }

    const PRIORITY_LABELS = {
      1: { text: 'Continuo – ASAP', badge: 'bg-white text-black font-bold' },
      2: { text: 'Nuovo – ASAP', badge: 'bg-neutral-300 text-black font-medium' },
      3: { text: 'Continuo – Relax', badge: 'bg-neutral-800 text-neutral-300 border border-neutral-700' },
      4: { text: 'Nuovo – Relax', badge: 'bg-neutral-900 text-neutral-500 border border-neutral-800' },
      0: { text: 'Iscrizione Evento', badge: 'bg-emerald-950 text-emerald-300 border border-emerald-800' }
    };

    function renderList() {
      if (!currentArtistId) return;

      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const locationFilter = document.getElementById('filter-location').value;
      const priorityFilter = document.getElementById('filter-priority').value;

      let filtered = clientsData.filter(c => {
        const clientArtist = c.artistId || 'claudia';
        if (clientArtist !== currentArtistId) return false;

        const matchesSearch = searchQuery === '' || 
                              c.name.toLowerCase().includes(searchQuery) || 
                              (c.notes && c.notes.toLowerCase().includes(searchQuery)) ||
                              c.contact.includes(searchQuery);

        const matchesLocation = (locationFilter === 'ALL') || (c.location === locationFilter);

        const p = String(c.priority !== undefined && c.priority !== null ? c.priority : '4');
        let matchesPriority = true;

        if (priorityFilter === 'ALL_CONTINUO') {
          matchesPriority = (p === '1' || p === '3');
        } else if (priorityFilter === 'ALL_NUOVO') {
          matchesPriority = (p === '2' || p === '4');
        } else if (priorityFilter === 'EVENT') {
          matchesPriority = (p === '0');
        } else if (priorityFilter !== 'ALL') {
          matchesPriority = (p === priorityFilter);
        }

        return matchesSearch && matchesLocation && matchesPriority;
      });

      filtered.sort((a, b) => {
        const pA = parseInt(a.priority !== undefined ? a.priority : 4);
        const pB = parseInt(b.priority !== undefined ? b.priority : 4);

        if (pA !== pB) return pA - pB;
        return new Date(a.date) - new Date(b.date);
      });

      const listContainer = document.getElementById('client-list');
      const emptyState = document.getElementById('empty-state');

      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach((client, index) => {
        const pVal = client.priority !== undefined ? client.priority : 4;
        const pInfo = PRIORITY_LABELS[pVal] || PRIORITY_LABELS[4];
        const cleanPhone = client.contact.replace(/\D/g, '');
        const waUrl = `https://wa.me/${cleanPhone}`;

        const card = document.createElement('div');
        card.className = 'bg-brand-card border border-brand-border rounded-xl p-4 space-y-3 transition-all hover:border-neutral-700 relative group';

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-bold text-brand-muted bg-brand-black px-2 py-1 rounded-md border border-brand-border">#${index + 1}</span>
              <h3 class="font-bold text-white text-base tracking-wide">${escapeHtml(client.name)}</h3>
            </div>
            <span class="text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider ${pInfo.badge}">
              ${pInfo.text}
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-neutral-400">
            <div class="flex items-center gap-1.5">
              <i data-lucide="phone" class="w-3.5 h-3.5 text-brand-muted pointer-events-none"></i>
              <span>${escapeHtml(client.contact)}</span>
              <a href="${waUrl}" target="_blank" class="ml-1 text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-0.5">
                [💬 WhatsApp]
              </a>
            </div>

            <div class="flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-muted pointer-events-none"></i>
              <span>${escapeHtml(client.location)}</span>
            </div>

            <div class="flex items-center gap-1.5 sm:col-span-2">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-muted pointer-events-none"></i>
              <span>Data Inserimento: ${formatDate(client.date)}</span>
            </div>
          </div>

          ${client.notes ? `
            <div class="text-xs text-neutral-300 bg-brand-black/60 border border-brand-border/50 p-2.5 rounded-lg italic">
              "${escapeHtml(client.notes)}"
            </div>
          ` : ''}

          <div class="flex justify-end gap-3 pt-1 border-t border-brand-border/40 text-xs">
            <button type="button" onclick="editClient('${client.id}')" class="text-neutral-400 hover:text-white flex items-center gap-1 py-1">
              <i data-lucide="edit-3" class="w-3.5 h-3.5 pointer-events-none"></i> Modifica
            </button>
            <button type="button" onclick="deleteClient('${client.id}')" class="text-red-400/80 hover:text-red-400 flex items-center gap-1 py-1">
              <i data-lucide="trash-2" class="w-3.5 h-3.5 pointer-events-none"></i> Elimina
            </button>
          </div>
        `;

        listContainer.appendChild(card);
      });

      if (window.lucide) lucide.createIcons();
    }

    function openManageLocationsModal() {
      renderManageLocationsList();
      document.getElementById('locations-modal').classList.remove('hidden');
    }

    function closeManageLocationsModal() {
      document.getElementById('locations-modal').classList.add('hidden');
      populateLocationDropdowns();
      renderList();
    }

    function renderManageLocationsList() {
      const locations = getArtistLocations();
      const container = document.getElementById('locations-list');
      container.innerHTML = '';

      locations.forEach((loc, index) => {
        container.innerHTML += `
          <div class="flex items-center justify-between bg-brand-black p-2.5 rounded-xl border border-brand-border text-xs">
            <span class="text-white font-medium">${escapeHtml(loc.name)} ${loc.isSinglePriority ? '<span class="text-[10px] text-brand-muted">(Single Rank)</span>' : ''}</span>
            <button onclick="removeLocation(${index})" class="text-red-400 hover:text-red-300 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      });

      if (window.lucide) lucide.createIcons();
    }

    function addCustomLocation() {
      const input = document.getElementById('new-location-name');
      const isSingle = document.getElementById('new-location-single-priority').checked;
      const name = input.value.trim();

      if (!name) return;

      const locations = [...getArtistLocations()];
      locations.push({ name: name, isSinglePriority: isSingle });

      if (!customLocations[currentArtistId]) customLocations[currentArtistId] = [];
      customLocations[currentArtistId] = locations;

      localStorage.setItem('custom_artist_locations', JSON.stringify(customLocations));
      input.value = '';
      document.getElementById('new-location-single-priority').checked = false;

      renderManageLocationsList();
    }

    function removeLocation(index) {
      let locations = [...getArtistLocations()];
      locations.splice(index, 1);

      if (!customLocations[currentArtistId]) customLocations[currentArtistId] = [];
      customLocations[currentArtistId] = locations;

      localStorage.setItem('custom_artist_locations', JSON.stringify(customLocations));
      renderManageLocationsList();
    }

    function handleLocationChange() {
      const selectedLoc = document.getElementById('field-location').value;
      const priorityContainer = document.getElementById('priority-container');
      const prioritySelect = document.getElementById('field-priority');
      const locations = getArtistLocations();

      const locObj = locations.find(l => l.name === selectedLoc);
      if (locObj && locObj.isSinglePriority) {
        priorityContainer.classList.add('hidden');
        prioritySelect.removeAttribute('required');
      } else {
        priorityContainer.classList.remove('hidden');
        prioritySelect.setAttribute('required', 'required');
      }
    }

    function openModal(isEdit = false) {
      if (!isEdit) {
        document.getElementById('client-form').reset();
        document.getElementById('field-id').value = '';
        document.getElementById('modal-title').innerText = 'Nuovo Cliente';
        document.getElementById('field-date').valueAsDate = new Date();
      }
      handleLocationChange();
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function editClient(id) {
      const client = clientsData.find(c => c.id === id);
      if (!client) return;

      document.getElementById('field-id').value = client.id;
      document.getElementById('field-name').value = client.name;
      document.getElementById('field-contact').value = client.contact;
      document.getElementById('field-location').value = client.location;
      
      handleLocationChange();
      if (client.priority !== undefined && client.priority !== '0') {
        document.getElementById('field-priority').value = String(client.priority);
      }

      document.getElementById('field-date').value = client.date;
      document.getElementById('field-notes').value = client.notes || '';

      document.getElementById('modal-title').innerText = 'Modifica Cliente';
      openModal(true);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const selectedLoc = document.getElementById('field-location').value;
      const locations = getArtistLocations();
      const locObj = locations.find(l => l.name === selectedLoc);
      const isSingle = locObj ? locObj.isSinglePriority : false;

      const clientData = {
        id: document.getElementById('field-id').value || null,
        name: document.getElementById('field-name').value.trim(),
        contact: document.getElementById('field-contact').value.trim(),
        priority: isSingle ? '0' : String(document.getElementById('field-priority').value),
        location: selectedLoc,
        date: document.getElementById('field-date').value,
        notes: document.getElementById('field-notes').value.trim()
      };

      await saveClient(clientData);
      closeModal();
    }

    function startVoiceRecognition(e) {
      if (e) e.preventDefault();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Il tuo browser non supporta la dettatura vocale.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.interimResults = false;

      const pulse = document.getElementById('voice-pulse');
      pulse.classList.remove('hidden');

      recognition.start();

      recognition.onresult = function(event) {
        pulse.classList.add('hidden');
        const transcript = event.results[0][0].transcript.toLowerCase();
        parseVoiceCommand(transcript);
      };

      recognition.onerror = function() {
        pulse.classList.add('hidden');
        alert("Errore o nessun comando rilevato. Riprova.");
      };

      recognition.onend = function() {
        pulse.classList.add('hidden');
      };
    }

    function parseVoiceCommand(text) {
      openModal(false);

      let nameMatch = text.match(/(?:aggiungi|cliente)\s+([a-zàèéìòù\s]+?)(?=\s+(?:per|a|in|nuovo|continuo|telefono|numero|$))/i);
      if (nameMatch) {
        document.getElementById('field-name').value = capitalizeWords(nameMatch[1].trim());
      } else {
        const words = text.split(' ');
        if (words.length > 0) document.getElementById('field-name').value = capitalizeWords(words.slice(0, 2).join(' '));
      }

      const locations = getArtistLocations();
      let matchedLoc = locations[0]?.name || 'The Grind';

      for (let loc of locations) {
        if (text.includes(loc.name.toLowerCase())) {
          matchedLoc = loc.name;
          break;
        }
      }

      document.getElementById('field-location').value = matchedLoc;
      handleLocationChange();

      const isContinuo = text.includes('continuo') || text.includes('proseguire') || text.includes('progetto');
      const isAsap = text.includes('prima possibile') || text.includes('urgente') || text.includes('subito');

      if (isContinuo && isAsap) {
        document.getElementById('field-priority').value = '1';
      } else if (!isContinuo && isAsap) {
        document.getElementById('field-priority').value = '2';
      } else if (isContinuo && !isAsap) {
        document.getElementById('field-priority').value = '3';
      } else {
        document.getElementById('field-priority').value = '4';
      }

      const phoneMatch = text.match(/\d[\d\s]{7,}\d/);
      if (phoneMatch) {
        document.getElementById('field-contact').value = phoneMatch[0].replace(/\s+/g, '');
      }

      document.getElementById('field-notes').value = "Inserito via voce: " + text;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    function capitalizeWords(str) {
      return str.replace(/\b\w/g, l => l.toUpperCase());
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
