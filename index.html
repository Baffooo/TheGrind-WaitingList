<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Grind Waiting List Multi-Artist</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Grind">
  <meta name="theme-color" content="#0a0a0a">
  <script>if (window.navigator.standalone) document.documentElement.classList.add('is-standalone');</script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          fontFamily: {
            artistHome: ['Audiowide', 'sans-serif'],
            heading: ['Space Grotesk', 'sans-serif']
          },
          colors: {
            brand: {
              black: '#0a0a0a',
              card: '#121212',
              border: '#262626',
              muted: '#737373'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0a0a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
    }

    .safe-top { padding-top: calc(env(safe-area-inset-top, 0px) + var(--pt-base, 0px)) !important; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--pb-base, 0px)) !important; }
    html.is-standalone .safe-top { padding-top: calc(max(env(safe-area-inset-top, 0px), 52px) + var(--pt-base, 0px)) !important; }
    
    .logo-playing img { animation: logoSparkleBounce 0.8s ease-in-out infinite alternate; }
    button, a, select, input, textarea, label, [onclick] { touch-action: manipulation; }

    .artist-btn { transition: all 0.2s ease; }
    .artist-btn:active { transform: scale(0.97); }
    .artist-name { transition: color 0.25s ease; }
    @media (hover: hover) {
      .artist-btn:hover { border-color: var(--cm) !important; background-color: var(--cbg) !important; box-shadow: 0 0 18px var(--cg); transform: scale(1.02); }
      .artist-btn:hover .artist-name { color: var(--c); }
    }
    .artist-btn:active { background-color: var(--cbg) !important; }
    .artist-btn:active .artist-name { color: var(--c); }

    @keyframes logoSparkleBounce {
      0% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 0 20px rgba(255,255,255,0.3)) brightness(1); }
      30% { transform: translateY(-12px) scale(1.08) rotate(-2deg); filter: drop-shadow(0 0 35px rgba(255,255,255,0.8)) brightness(1.35); }
      60% { transform: translateY(-5px) scale(1.03) rotate(1deg); filter: drop-shadow(0 0 45px rgba(255,255,255,1)) brightness(1.6); }
      100% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 0 20px rgba(255,255,255,0.3)) brightness(1); }
    }
    .logo-hover-effect:active img { animation: logoSparkleBounce 0.8s ease-in-out infinite alternate; }
    @media (hover: hover) {
      .logo-hover-effect:hover img { animation: logoSparkleBounce 0.8s ease-in-out infinite alternate; }
    }

    @keyframes micRing {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
      100% { box-shadow: 0 0 0 18px rgba(239,68,68,0); }
    }
    .mic-listening { animation: micRing 1.1s ease-out infinite; }
  </style>
</head>
<body class="flex flex-col">

  <!-- ===================== HOME: SELEZIONE ARTISTA + LISTA SPESA ===================== -->
  <div id="artist-selector-screen" class="bg-brand-black flex flex-col items-center justify-start p-4 md:p-8 safe-top" style="--pt-base:1.5rem; min-height:100vh; min-height:100dvh;">

    <div id="home-artists-view" class="w-full max-w-2xl flex flex-col items-center space-y-4 md:space-y-6 pb-24 my-auto">
      <div class="text-center space-y-2.5 md:space-y-4 w-full">
        <div class="logo-hover-effect w-36 h-36 sm:w-44 sm:h-44 md:w-60 md:h-60 mx-auto flex items-center justify-center overflow-visible cursor-pointer transition-all duration-300">
          <img src="logo.jpg" alt="Logo The Grind" class="max-w-full max-h-full object-contain transition-all duration-300">
        </div>

        <div class="w-full">
          <h1 class="font-heading text-[clamp(0.95rem,5vw,2rem)] font-black tracking-wide text-white uppercase whitespace-nowrap text-center">THE GRIND TATTOO FINEST</h1>
          <p class="text-[11px] sm:text-xs md:text-sm text-brand-muted tracking-[0.35em] md:tracking-[0.45em] uppercase font-bold mt-1 md:mt-2 text-center">PICK THE ARTIST</p>
        </div>
      </div>

      <div id="artist-buttons" class="w-full flex flex-col items-center space-y-2 md:space-y-3.5"></div>
      <div class="pt-4 flex items-center gap-3 text-[11px] text-neutral-500">
        <span id="app-version" class="font-mono">v4.2</span>
        <button type="button" onclick="forceUpdate()" class="underline underline-offset-2 hover:text-neutral-300 px-2 py-1">Aggiorna</button>
      </div>
    </div>

    <!-- Vista lista della spesa -->
    <div id="home-shopping-view" class="w-full max-w-md space-y-3 hidden my-auto pb-24">
      <div class="flex justify-between items-center bg-brand-card border border-brand-border p-3.5 rounded-2xl gap-2">
        <div class="flex items-center gap-3 min-w-0">
          <div class="logo-hover-effect w-10 h-10 flex items-center justify-center overflow-visible cursor-pointer shrink-0">
            <img src="logo.jpg" alt="Logo" class="max-w-full max-h-full object-contain">
          </div>
          <div class="min-w-0">
            <h2 class="text-sm font-bold text-white uppercase tracking-wider truncate">Lista della Spesa</h2>
            <p id="shopping-subtitle" class="text-[10px] text-brand-muted">Gestione scorte &amp; materiali</p>
          </div>
        </div>
        <div class="flex gap-1.5 shrink-0">
          <button onclick="openVoice('shopping')" class="p-2 rounded-xl bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-600/30 transition-all" title="Aggiungi a voce">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>
          <button onclick="clearDoneShopping()" class="p-2 rounded-xl bg-brand-black border border-brand-border text-neutral-300 hover:text-white transition-all" title="Rimuovi gli articoli già comprati">
            <i data-lucide="check-check" class="w-4 h-4"></i>
          </button>
          <button onclick="confirmClearShoppingList()" class="p-2 rounded-xl bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30 transition-all" title="Elimina tutto">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
          <button onclick="toggleShoppingViewHome()" class="p-2 rounded-xl bg-brand-black border border-brand-border text-white hover:bg-neutral-800 transition-all" title="Torna alla Home">
            <i data-lucide="home" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <input type="hidden" id="shopping-item-edit-id" value="">

      <div class="grid grid-cols-[1fr_56px_auto] gap-1.5 items-center bg-brand-card border border-brand-border p-2 rounded-xl">
        <input type="text" id="shopping-item-name" placeholder="Articolo..." onkeydown="if(event.key==='Enter'){addShoppingItemManual()}" class="w-full bg-brand-black border border-brand-border rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-white">
        <input type="number" inputmode="numeric" id="shopping-item-qty" value="1" min="1" class="w-full bg-brand-black border border-brand-border rounded-lg px-1 py-2 text-xs text-white text-center focus:outline-none focus:border-white">
        <button id="shopping-submit-btn" onclick="addShoppingItemManual()" class="px-3 py-2 rounded-lg bg-emerald-600 text-white font-semibold text-xs hover:bg-emerald-500 transition-all whitespace-nowrap">Aggiungi</button>
      </div>

      <div id="shopping-list-container" class="space-y-2 max-h-[55vh] max-h-[55dvh] overflow-y-auto custom-scrollbar"></div>

      <div id="shopping-empty-state" class="hidden py-8 text-center space-y-2">
        <i data-lucide="shopping-cart" class="w-10 h-10 mx-auto text-brand-muted stroke-1"></i>
        <p class="text-brand-muted text-xs">La lista della spesa è vuota.</p>
      </div>
    </div>

    <!-- Bottone carrello -->
    <div id="home-shopping-fab" class="fixed z-40 left-0 right-0 flex justify-center pointer-events-none" style="bottom: calc(1.5rem + env(safe-area-inset-bottom));">
      <button onclick="toggleShoppingViewHome()" id="shopping-fab-btn" class="pointer-events-auto p-4 rounded-full bg-emerald-600 text-white shadow-[0_4px_25px_rgba(16,185,129,0.5)] hover:bg-emerald-500 hover:scale-110 transition-all active:scale-95 flex items-center justify-center cursor-pointer" title="Apri Lista della Spesa">
        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
      </button>
    </div>
  </div>

  <!-- ===================== PAGINA ARTISTA ===================== -->
  <div id="artist-view" class="hidden">

  <!-- ===================== HEADER PAGINA ARTISTA ===================== -->
  <header class="sticky top-0 z-30 bg-brand-black/95 backdrop-blur-md border-b border-brand-border px-4 py-3.5 flex justify-between items-center gap-2 safe-top shadow-md" style="--pt-base:1.25rem">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <div onclick="openArtistSelectionScreen()" class="logo-hover-effect w-11 h-11 flex items-center justify-center shrink-0 overflow-visible cursor-pointer" title="Cambia Artista">
        <img src="logo.jpg" alt="Logo" class="max-w-full max-h-full object-contain">
      </div>
      <div class="min-w-0">
        <div onclick="openArtistSelectionScreen()" class="flex items-center gap-1.5 cursor-pointer group" title="Clicca per cambiare artista">
          <h1 id="artist-title" class="font-heading font-bold text-sm tracking-wider text-white uppercase leading-snug truncate group-hover:underline">CLAUDIA BINDI</h1>
          <i data-lucide="repeat" class="w-3 h-3 text-brand-muted group-hover:text-white shrink-0"></i>
        </div>
        <h2 class="text-[10px] font-bold tracking-widest text-neutral-300 uppercase leading-tight mt-0.5 truncate">WAITING LIST</h2>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0 z-10">
      <button type="button" id="voice-btn" onclick="openVoice('client')" class="p-2.5 rounded-full bg-brand-card border border-brand-border text-white hover:border-white transition-all active:scale-95 cursor-pointer" title="Aggiungi cliente a voce">
        <i data-lucide="mic" class="w-5 h-5 pointer-events-none"></i>
      </button>
      <button type="button" onclick="openModal(false)" id="btn-new-client" class="px-3.5 py-2 rounded-full text-black font-semibold text-sm transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer">
        <i data-lucide="plus" class="w-4 h-4 pointer-events-none"></i> Nuovo
      </button>
    </div>
  </header>

  <!-- ===================== LISTA D'ATTESA ARTISTA ===================== -->
  <main id="main-waiting-section" class="max-w-2xl w-full mx-auto px-4 pt-5 pb-12 space-y-4">
    <div class="flex justify-between items-center text-xs px-1 text-brand-muted gap-2">
      <span id="status-indicator">Inizializzazione...</span>
      <span id="list-counter" class="shrink-0"></span>
    </div>

    <div class="space-y-2">
      <div class="relative w-full">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-brand-muted"></i>
        <input type="text" id="search-input" oninput="renderList()" placeholder="Cerca cliente, telefono o note..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-white">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div class="flex gap-1">
          <select id="filter-location" onchange="renderList()" class="bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white w-full truncate"></select>
          <button onclick="openManageLocationsModal()" class="p-2 bg-brand-card border border-brand-border rounded-xl text-brand-muted hover:text-white transition-all shrink-0 cursor-pointer" title="Gestisci Luoghi">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>

        <select id="filter-priority" onchange="renderList()" class="bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white w-full truncate">
          <option value="ALL">Tutte le Tipologie</option>
          <option value="1">Continuo – ASAP</option>
          <option value="2">Nuovo – ASAP</option>
          <option value="3">Continuo – Relax</option>
          <option value="4">Nuovo – Relax</option>
          <option value="ALL_CONTINUO">Tutti i Continui</option>
          <option value="ALL_NUOVO">Tutti i Nuovi</option>
          <option value="EVENT">Iscrizioni Eventi</option>
        </select>
      </div>
    </div>

    <div id="client-list" class="space-y-3"></div>

    <div id="empty-state" class="hidden py-16 text-center space-y-3">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto text-brand-muted stroke-1"></i>
      <p class="text-brand-muted text-sm">Nessun cliente presente in questa lista d'attesa.</p>
    </div>
  </main>

  </div><!-- fine #artist-view -->

  <!-- ===================== MODALE CLIENTE ===================== -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeModal()">
    <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-5 max-h-[90vh] max-h-[90dvh] overflow-y-auto custom-scrollbar safe-bottom" style="--pb-base:1.5rem">
      <div class="flex justify-between items-center border-b border-brand-border pb-3">
        <h2 id="modal-title" class="text-lg font-bold text-white uppercase tracking-wider">Nuovo Cliente</h2>
        <button type="button" onclick="closeModal()" class="text-brand-muted hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5 pointer-events-none"></i>
        </button>
      </div>

      <form id="client-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="field-id">

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Nome Cliente *</label>
          <input type="text" id="field-name" required placeholder="Es. Mario Rossi" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Contatto (Telefono) *</label>
          <input type="tel" id="field-contact" required placeholder="Es. +39 333 1234567" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Luogo *</label>
          <select id="field-location" required onchange="handleLocationChange()" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white"></select>
        </div>

        <div id="priority-container">
          <label class="block text-xs font-medium text-brand-muted mb-1">Tipo Progetto &amp; Priorità *</label>
          <select id="field-priority" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
            <option value="1">Continuo Progetto – Prima possibile (Rank 1)</option>
            <option value="2">Nuovo Tatuaggio – Prima possibile (Rank 2)</option>
            <option value="3">Continuo Progetto – Senza fretta (Rank 3)</option>
            <option value="4">Nuovo Tatuaggio – Senza fretta (Rank 4)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Data Inserimento *</label>
          <input type="date" id="field-date" required class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Note</label>
          <textarea id="field-notes" rows="3" placeholder="Dettagli progetto, zona corpo, orari..." class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-brand-border text-brand-muted hover:text-white font-medium text-sm transition-all">Annulla</button>
          <button type="submit" id="btn-save-modal" class="flex-1 py-2.5 rounded-xl text-black font-semibold text-sm transition-all">Salva Cliente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== MODALE LUOGHI ===================== -->
  <div id="locations-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeManageLocationsModal()">
    <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] max-h-[90dvh] overflow-y-auto custom-scrollbar safe-bottom" style="--pb-base:1.5rem">
      <div class="flex justify-between items-center border-b border-brand-border pb-3">
        <h2 class="text-base font-bold text-white uppercase tracking-wider">Gestione Luoghi</h2>
        <button type="button" onclick="closeManageLocationsModal()" class="text-brand-muted hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex flex-wrap gap-2">
        <input type="text" id="new-location-name" placeholder="Nuovo Luogo..." onkeydown="if(event.key==='Enter'){addCustomLocation()}" class="flex-1 min-w-[140px] bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        <label class="flex items-center gap-1.5 text-xs text-brand-muted px-2 border border-brand-border rounded-xl bg-brand-black cursor-pointer py-2">
          <input type="checkbox" id="new-location-single-priority" class="rounded"> Single Rank
        </label>
        <button onclick="addCustomLocation()" id="btn-add-loc" class="px-3 py-2 rounded-xl text-black font-semibold text-xs transition-all">Aggiungi</button>
      </div>

      <div id="locations-list" class="space-y-2 pt-2"></div>
    </div>
  </div>

  <!-- ===================== PANNELLO COMANDO VOCALE ===================== -->
  <div id="voice-sheet" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeVoice()">
    <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 max-h-[92vh] max-h-[92dvh] overflow-y-auto custom-scrollbar safe-bottom" style="--pb-base:1.25rem">
      <div class="flex justify-between items-center">
        <h2 id="voice-title" class="text-base font-bold text-white uppercase tracking-wider">Comando vocale</h2>
        <button type="button" onclick="closeVoice()" class="text-brand-muted hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5 pointer-events-none"></i>
        </button>
      </div>

      <div class="flex items-center gap-3">
        <button type="button" id="voice-mic" onclick="toggleListening()" class="w-14 h-14 rounded-full bg-neutral-800 border border-brand-border text-white flex items-center justify-center shrink-0 transition-all active:scale-95">
          <i data-lucide="mic" class="w-6 h-6 pointer-events-none"></i>
        </button>
        <p id="voice-status" class="text-sm text-neutral-300 leading-snug">Pronto.</p>
      </div>

      <textarea id="voice-text" rows="3" oninput="onVoiceTextChange()" placeholder="Il testo detto compare qui. Puoi correggerlo o scriverlo a mano." class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white"></textarea>

      <p id="voice-hint" class="text-[11px] text-brand-muted leading-relaxed"></p>

      <div id="voice-preview" class="text-xs text-neutral-200 space-y-1"></div>

      <div class="flex gap-2 pt-1">
        <button type="button" onclick="closeVoice()" class="flex-1 py-2.5 rounded-xl border border-brand-border text-brand-muted hover:text-white font-medium text-sm transition-all">Annulla</button>
        <button type="button" id="voice-confirm" onclick="confirmVoice()" disabled class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-semibold text-sm transition-all disabled:opacity-30 disabled:cursor-not-allowed">Conferma</button>
      </div>
    </div>
  </div>

  <!-- Banner aggiornamento -->
  <div id="update-banner" class="hidden fixed left-3 right-3 z-[80] bg-white text-black rounded-xl px-4 py-3 flex items-center justify-between gap-3 shadow-2xl" style="bottom: calc(1rem + env(safe-area-inset-bottom));">
    <span id="update-banner-text" class="text-sm font-medium"></span>
    <button type="button" id="update-banner-btn" class="px-3 py-1.5 rounded-lg bg-black text-white text-sm font-semibold shrink-0">Aggiorna</button>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 z-[70] max-w-[90vw] px-4 py-2.5 rounded-xl bg-white text-black text-sm font-medium shadow-2xl" style="bottom: calc(5rem + env(safe-area-inset-bottom));"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // =====================================================================
    // CONFIGURAZIONE
    // =====================================================================
    const ARTISTS_CONFIG = {

    function safeParse(str, fallback) {
      try { const v = JSON.parse(str); return v === null || v === undefined ? fallback : v; } catch (e) { return fallback; }
    }

    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }
    function todayStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function capitalizeWords(str) {
      return str.split(/\s+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }
    function capFirst(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : str; }
    function norm(str) { return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }
    function newLocalId() { return 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

      db.collection("waiting_list").onSnapshot(snapshot => {

        renderList();
      }, error => {
        console.error("Errore Firebase Clients:", error);
      });

      db.collection("shopping_list").onSnapshot(snapshot => {
        shoppingList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderShoppingList();
      }, error => {
        console.error("Errore Firebase Shopping List:", error);

      const config = ARTISTS_CONFIG[artistId];

      $('artist-title').innerText = config.name.toUpperCase();
      document.documentElement.style.setProperty('--artist-color', config.color);

    function getArtistLocations() {
      if (!currentArtistId) return [];
      return customLocations[currentArtistId] || ARTISTS_CONFIG[currentArtistId].defaultLocations;
    }

    function populateLocationDropdowns() {
      const locations = getArtistLocations();
      const filterLoc = $('filter-location');
      const fieldLoc = $('field-location');
      const prevFilter = filterLoc.value || 'ALL';
      const prevField = fieldLoc.value;

      filterLoc.innerHTML = '<option value="ALL">Tutti i Luoghi</option>' +
        locations.map(l => `<option value="${escapeHtml(l.name)}">${escapeHtml(l.name)}</option>`).join('');
      fieldLoc.innerHTML = locations.map(l => `<option value="${escapeHtml(l.name)}">${escapeHtml(l.name)}</option>`).join('');

      if ([...filterLoc.options].some(o => o.value === prevFilter)) filterLoc.value = prevFilter;
      if (prevField && [...fieldLoc.options].some(o => o.value === prevField)) fieldLoc.value = prevField;
    }

      localStorage.setItem('custom_artist_locations', JSON.stringify(customLocations));

      const locations = [...getArtistLocations()];

      saveLocations();
      input.value = '';

    async function saveClient(client) {
      client.artistId = currentArtistId;
      try {
        if (!useLocalStorage && db) {
          const id = client.id;
          delete client.id;
          if (id) await db.collection("waiting_list").doc(id).set(client);
          else await db.collection("waiting_list").add(client);
        } else {
          if (client.id) {
            const i = clientsData.findIndex(c => c.id === client.id);
            if (i !== -1) clientsData[i] = client;
          } else {
            client.id = newLocalId();
            clientsData.push(client);
          }
          saveLocal();
        }
        showToast('Cliente salvato');
      } catch (e) {
        console.error(e);
        showToast('Errore nel salvataggio: riprova', 4000);
      }
    }

    async function deleteClient(id) {
      if (!confirm("Sei sicuro di voler rimuovere questo cliente dalla lista d'attesa?")) return;
      try {
        if (!useLocalStorage && db) await db.collection("waiting_list").doc(id).delete();
        else { clientsData = clientsData.filter(c => c.id !== id); saveLocal(); }
      } catch (e) { showToast('Errore: impossibile eliminare', 4000); }

      1: { text: 'Continuo – ASAP', badge: 'bg-white text-black font-bold' },
      2: { text: 'Nuovo – ASAP', badge: 'bg-neutral-300 text-black font-medium' },
      3: { text: 'Continuo – Relax', badge: 'bg-neutral-800 text-neutral-300 border border-neutral-700' },
      4: { text: 'Nuovo – Relax', badge: 'bg-neutral-900 text-neutral-500 border border-neutral-800' },

    };

    function renderList() {
      if (!currentArtistId) return;

      const searchQuery = norm($('search-input').value);
      const locationFilter = $('filter-location').value || 'ALL';
      const priorityFilter = $('filter-priority').value;

      const filtered = clientsData.filter(c => {
        if ((c.artistId || 'claudia') !== currentArtistId) return false;

        const matchesSearch = searchQuery === '' ||
          norm(c.name).includes(searchQuery) ||
          norm(c.notes).includes(searchQuery) ||
          String(c.contact || '').replace(/\s/g, '').includes(searchQuery.replace(/\s/g, ''));

        const matchesLocation = locationFilter === 'ALL' || c.location === locationFilter;

        const p = String(c.priority !== undefined && c.priority !== null ? c.priority : '4');
        let matchesPriority = true;
        if (priorityFilter === 'ALL_CONTINUO') matchesPriority = (p === '1' || p === '3');
        else if (priorityFilter === 'ALL_NUOVO') matchesPriority = (p === '2' || p === '4');
        else if (priorityFilter === 'EVENT') matchesPriority = (p === '0');
        else if (priorityFilter !== 'ALL') matchesPriority = (p === priorityFilter);

        return matchesSearch && matchesLocation && matchesPriority;
      });

      filtered.sort((a, b) => {
        const pA = parseInt(a.priority !== undefined ? a.priority : 4);
        const pB = parseInt(b.priority !== undefined ? b.priority : 4);
        if (pA !== pB) return pA - pB;
        return new Date(a.date) - new Date(b.date);
      });

      const total = clientsData.filter(c => (c.artistId || 'claudia') === currentArtistId).length;
      $('list-counter').innerText = filtered.length === total ? `${total} in lista` : `${filtered.length} di ${total}`;

      const listContainer = $('client-list');
      const emptyState = $('empty-state');
      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach((client, index) => {
        const pVal = client.priority !== undefined ? client.priority : 4;
        const pInfo = PRIORITY_LABELS[pVal] || PRIORITY_LABELS[4];
        let cleanPhone = String(client.contact || '').replace(/[^\d+]/g, '');
        const waNumber = cleanPhone.replace(/^\+/, '').replace(/^00/, '');
        const waUrl = `https://wa.me/${waNumber}`;

        const card = document.createElement('div');
        card.className = 'bg-brand-card border border-brand-border rounded-xl p-4 space-y-3 transition-all hover:border-neutral-700 relative';
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xs font-mono font-bold text-brand-muted bg-brand-black px-2 py-1 rounded-md border border-brand-border shrink-0">#${index + 1}</span>
              <h3 class="font-bold text-white text-base tracking-wide truncate">${escapeHtml(client.name)}</h3>
            </div>
            <span class="text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shrink-0 ${pInfo.badge}">${pInfo.text}</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-neutral-400">
            <div class="flex items-center gap-1.5 flex-wrap">
              <i data-lucide="phone" class="w-3.5 h-3.5 text-brand-muted pointer-events-none"></i>
              <a href="tel:${escapeHtml(cleanPhone)}" class="hover:text-white">${escapeHtml(client.contact)}</a>
              <a href="${waUrl}" target="_blank" rel="noopener" class="ml-1 text-emerald-400 hover:text-emerald-300 font-semibold">[💬 WhatsApp]</a>
            </div>
            <div class="flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-muted pointer-events-none"></i>
              <span>${escapeHtml(client.location)}</span>
            </div>
            <div class="flex items-center gap-1.5 sm:col-span-2">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-muted pointer-events-none"></i>
              <span>Data Inserimento: ${formatDate(client.date)}</span>
            </div>
          </div>

          ${client.notes ? `<div class="text-xs text-neutral-300 bg-brand-black/60 border border-brand-border/50 p-2.5 rounded-lg italic">"${escapeHtml(client.notes)}"</div>` : ''}

          <div class="flex justify-end gap-4 pt-1 border-t border-brand-border/40 text-xs">
            <button type="button" onclick="editClient('${client.id}')" class="text-neutral-400 hover:text-white flex items-center gap-1 py-2">
              <i data-lucide="edit-3" class="w-3.5 h-3.5 pointer-events-none"></i> Modifica
            </button>
            <button type="button" onclick="deleteClient('${client.id}')" class="text-red-400/80 hover:text-red-400 flex items-center gap-1 py-2">
              <i data-lucide="trash-2" class="w-3.5 h-3.5 pointer-events-none"></i> Elimina
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });

      refreshIcons();

    function openModal(isEdit = false) {
      if (!isEdit) {
        $('client-form').reset();
        $('field-id').value = '';
        $('modal-title').innerText = 'Nuovo Cliente';
        $('field-date').value = todayStr();
      }
      handleLocationChange();
      $('modal').classList.remove('hidden');

    function closeModal() { $('modal').classList.add('hidden'); }

    function editClient(id) {
      const client = clientsData.find(c => c.id === id);
      if (!client) return;
      $('field-id').value = client.id;
      $('field-name').value = client.name;
      $('field-contact').value = client.contact;
      $('field-location').value = client.location;
      if (client.priority !== undefined && String(client.priority) !== '0') {
        $('field-priority').value = String(client.priority);
      }
      $('field-date').value = client.date;
      $('field-notes').value = client.notes || '';
      $('modal-title').innerText = 'Modifica Cliente';
      openModal(true);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const selectedLoc = $('field-location').value;
      const locObj = getArtistLocations().find(l => l.name === selectedLoc);
      const isSingle = locObj ? locObj.isSinglePriority : false;

      const clientData = {
        id: $('field-id').value || null,
        name: $('field-name').value.trim(),
        contact: $('field-contact').value.trim(),
        priority: isSingle ? '0' : String($('field-priority').value),
        location: selectedLoc,
        date: $('field-date').value,
        notes: $('field-notes').value.trim()
      };
      await saveClient(clientData);
      closeModal();
    }

    function toggleShoppingViewHome() {
      isHomeShoppingActive = !isHomeShoppingActive;
      const fabBtn = $('shopping-fab-btn');
      if (isHomeShoppingActive) {
        $('home-artists-view').classList.add('hidden');
        $('home-shopping-view').classList.remove('hidden');
        fabBtn.classList.remove('bg-emerald-600');
        fabBtn.classList.add('bg-white', 'text-black');
        renderShoppingList();
      } else {
        $('home-shopping-view').classList.add('hidden');
        $('home-artists-view').classList.remove('hidden');
        fabBtn.classList.remove('bg-white', 'text-black');
        fabBtn.classList.add('bg-emerald-600', 'text-white');
        resetShoppingForm();
      }
    }

    function sortedShopping() {
      return [...shoppingList].sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || (a.createdAt || 0) - (b.createdAt || 0));
    }

    function renderShoppingList() {
      const container = $('shopping-list-container');
      const emptyState = $('shopping-empty-state');
      const todo = shoppingList.filter(i => !i.done).length;
      $('shopping-subtitle').innerText = shoppingList.length === 0 ? 'Gestione scorte & materiali' : `${todo} da comprare · ${shoppingList.length - todo} presi`;
      if (!isHomeShoppingActive) return;

      container.innerHTML = '';
      if (shoppingList.length === 0) { emptyState.classList.remove('hidden'); return; }
      emptyState.classList.add('hidden');

      sortedShopping().forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'bg-brand-card border border-brand-border rounded-xl p-2.5 flex items-center gap-2 ' + (item.done ? 'opacity-50' : '');
        row.innerHTML = `
          <button onclick="toggleShoppingDone('${item.id}')" class="w-7 h-7 rounded-full border ${item.done ? 'bg-emerald-600 border-emerald-500 text-white' : 'border-brand-border text-transparent hover:border-white'} flex items-center justify-center shrink-0" title="Segna come comprato">
            <i data-lucide="check" class="w-4 h-4 pointer-events-none"></i>
          </button>
          <span class="font-medium text-white text-sm leading-snug break-words flex-1 min-w-0 ${item.done ? 'line-through' : ''}">${escapeHtml(item.name)}</span>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="updateShoppingQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-brand-black border border-brand-border text-white hover:border-white flex items-center justify-center text-sm font-bold" title="Diminuisci">−</button>
            <span class="text-xs text-white font-mono w-6 text-center">${item.qty}</span>

    async function shopUpsert(name, qty) {
      const key = norm(name);
      const existing = shoppingList.find(i => norm(i.name) === key && !i.done);
      if (!useLocalStorage && db) {
        if (existing) await db.collection("shopping_list").doc(existing.id).update({ qty: existing.qty + qty });
        else await db.collection("shopping_list").add({ name, qty, done: false, createdAt: Date.now() });
      } else {
        if (existing) existing.qty += qty;
        else shoppingList.push({ id: newLocalId(), name, qty, done: false, createdAt: Date.now() });
        saveLocal();
      }
    }
    async function shopUpdate(id, fields) {
      if (!useLocalStorage && db) await db.collection("shopping_list").doc(id).update(fields);
      else {
        const item = shoppingList.find(i => i.id === id);
        if (item) Object.assign(item, fields);
        saveLocal();
      }
    }
    async function shopRemoveMany(ids) {
      if (!ids.length) return;
      if (!useLocalStorage && db) {
        const batch = db.batch();
        ids.forEach(id => batch.delete(db.collection("shopping_list").doc(id)));
        await batch.commit();
      } else {
        shoppingList = shoppingList.filter(i => !ids.includes(i.id));
        saveLocal();
      }
    }

    async function addShoppingItemManual() {
      const name = capFirst($('shopping-item-name').value.trim());
      const qty = Math.max(1, parseInt($('shopping-item-qty').value) || 1);
      const editId = $('shopping-item-edit-id').value;
      if (!name) return;
      try {
        if (editId) await shopUpdate(editId, { name, qty });
        else await shopUpsert(name, qty);
        resetShoppingForm();
      } catch (e) { showToast('Errore nel salvataggio', 4000); }
    }

    function editShoppingItem(id) {
      const item = shoppingList.find(i => i.id === id);
      if (!item) return;
      $('shopping-item-name').value = item.name;
      $('shopping-item-qty').value = item.qty;
      $('shopping-item-edit-id').value = item.id;
      const btn = $('shopping-submit-btn');
      btn.innerText = 'Salva';
      btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
      btn.classList.add('bg-blue-600', 'hover:bg-blue-500');

    function resetShoppingForm() {
      $('shopping-item-name').value = '';
      $('shopping-item-qty').value = '1';

    async function toggleShoppingDone(id) {
      const item = shoppingList.find(i => i.id === id);
      if (!item) return;
      try { await shopUpdate(id, { done: !item.done }); } catch (e) { showToast('Errore', 3000); }
    }

    async function updateShoppingQty(id, delta) {
      const item = shoppingList.find(i => i.id === id);
      if (!item) return;
      const newQty = item.qty + delta;
      try {
        if (newQty <= 0) await shopRemoveMany([id]);
        else await shopUpdate(id, { qty: newQty });
      } catch (e) { showToast('Errore', 3000); }
    }

    async function removeShoppingItem(id) {
      try { await shopRemoveMany([id]); resetShoppingForm(); } catch (e) { showToast('Errore', 3000); }

    async function clearDoneShopping() {
      const ids = shoppingList.filter(i => i.done).map(i => i.id);
      if (!ids.length) { showToast('Nessun articolo segnato come comprato'); return; }
      try { await shopRemoveMany(ids); showToast(`Rimossi ${ids.length} articoli comprati`); } catch (e) { showToast('Errore', 3000); }
    }

    async function confirmClearShoppingList() {

    // COMANDI VOCALI & GEMINI API INTEGRATION
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let voiceBusy = false;
    let voiceSession = 0;
    let listening = false;
    let voiceMode = null;
    let parsedVoice = null;

    const NUM_WORDS = { zero: 0, un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10 };
    const DIGIT_WORDS = { zero: 0, uno: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9 };

    function isIOSStandalone() { return window.navigator.standalone === true; }

    function voiceUnsupportedReason() {
      if (!window.isSecureContext) return "Il microfono funziona solo su pagine https (o localhost).";
      if (voiceEngine() !== 'none') return null;
      return "Browser non supporta il riconoscimento vocale.";
    }

    function setVoiceStatus(text) { $('voice-status').innerText = text; }

    function updateMicUI() {
      const btn = $('voice-mic');
      btn.classList.toggle('bg-red-600', listening);
      btn.classList.toggle('mic-listening', listening);
      btn.classList.toggle('bg-neutral-800', !listening);
    }

    function openVoice(mode) {
      voiceMode = mode;
      voiceSession++;
      voiceBusy = false;
      parsedVoice = null;
      $('voice-title').innerText = mode === 'client' ? 'Nuovo cliente a voce' : 'Lista della spesa a voce';
      $('voice-hint').innerHTML = mode === 'client'
        ? 'Esempio: <em>"Aggiungi Mario Rossi, 333 1234567, The Grind, continuo progetto prima possibile"</em>'
        : 'Esempio: <em>"Aggiungi tre cartucce nere e due guanti"</em>';
      $('voice-text').value = '';
      $('voice-preview').innerHTML = '';
      $('voice-confirm').disabled = true;
      $('voice-sheet').classList.remove('hidden');
      refreshIcons();

      const reason = voiceUnsupportedReason();
      updateMicUI();
      if (reason && !GEMINI_API_KEY) {
        setVoiceStatus(reason);
        return;
      }
      startListening();
    }

    function closeVoice() {
      voiceSession++;
      stopListening(true);
      $('voice-sheet').classList.add('hidden');
    }

    function toggleListening() {
      if (voiceBusy) return;
      if (listening) stopListening(false);
      else { $('voice-text').value = ''; onVoiceTextChange(); startListening(); }
    }

    function stopListening(abort) {
      if (recState) { finishRecording(!!abort); return; }
      if (rec) { try { abort ? rec.abort() : rec.stop(); } catch (e) {} }
      if (abort) { rec = null; listening = false; updateMicUI(); }
    }

    function startListening() {
      if (listening) return;
      if (voiceEngine() === 'gemini') { startRecording(); return; }
      if (!SR) return;
      let finalText = '';
      let gotAnything = false;
      let hadError = false;

      rec = new SR();
      rec.lang = 'it-IT';
      rec.interimResults = true;
      rec.continuous = false;

      rec.onstart = () => { listening = true; updateMicUI(); setVoiceStatus('Ascoltando… parla ora'); };
      rec.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += t + ' ';
          else interim += t;
        }
        gotAnything = true;
        $('voice-text').value = (finalText + interim).trim();
        onVoiceTextChange();
      };
      rec.onerror = (e) => { hadError = true; setVoiceStatus('Errore microfono: ' + e.error); };
      rec.onend = () => { listening = false; updateMicUI(); };
      try { rec.start(); } catch (e) { setVoiceStatus('Impossibile avviare il microfono.'); }
    }

    let recState = null;

    function geminiAvailable() {
      return !!GEMINI_API_KEY && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !!(window.AudioContext || window.webkitAudioContext);
    }
    function voiceEngine() {
      if (!window.isSecureContext) return 'none';
      if (geminiAvailable()) return 'gemini';
      if (SR && !isIOSStandalone()) return 'native';
      return 'none';
    }

    async function startRecording() {
      if (recState || listening || voiceBusy) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      let ctx;
      try {
        ctx = new Ctx();
        if (ctx.resume) ctx.resume();
      } catch (e) { setVoiceStatus('Audio non disponibile.'); return; }

      const session = voiceSession;
      setVoiceStatus('Avvio microfono...');
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      } catch (e) {
        try { ctx.close(); } catch (_) {}
        setVoiceStatus('Permesso microfono negato.');
        return;
      }
      if (session !== voiceSession) { stream.getTracks().forEach(t => t.stop()); try { ctx.close(); } catch (_) {} return; }

      const source = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(4096, 1, 1);
      const st = { stream, ctx, source, proc, chunks: [], hasSpeech: false, silenceSince: 0, startedAt: Date.now(), stopping: false, session };
      proc.onaudioprocess = (e) => {
        const data = e.inputBuffer.getChannelData(0);
        st.chunks.push(new Float32Array(data));
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
        const rms = Math.sqrt(sum / data.length);
        const now = Date.now();
        if (rms > 0.012) { st.hasSpeech = true; st.silenceSince = 0; }
        else if (st.hasSpeech) {
          if (!st.silenceSince) st.silenceSince = now;
          else if (now - st.silenceSince > 1800) finishRecording(false);
        }
        if (now - st.startedAt > 25000) finishRecording(false);
      };
      source.connect(proc);
      proc.connect(ctx.destination);

      recState = st;
      listening = true;
      updateMicUI();
      setVoiceStatus('Registrazione in corso… parla e fai una pausa per terminare.');
    }

    async function finishRecording(cancel) {
      const st = recState;
      if (!st || st.stopping) return;
      st.stopping = true;
      recState = null;
      try { st.proc.onaudioprocess = null; st.proc.disconnect(); st.source.disconnect(); } catch (e) {}
      st.stream.getTracks().forEach(t => t.stop());
      const rate = st.ctx.sampleRate;
      try { st.ctx.close(); } catch (e) {}
      listening = false;
      updateMicUI();
      if (cancel) return;

      const samples = st.chunks.reduce((n, c) => n + c.length, 0);
      if (!st.hasSpeech || samples < rate * 0.4) {
        setVoiceStatus('Nessun audio rilevato.');
        return;
      }

      voiceBusy = true;
      setVoiceStatus('Trascrizione con Gemini in corso...');
      try {
        const text = await transcribeWithGemini(encodeWav(st.chunks, rate));
        if (st.session !== voiceSession) return;
        if (!text) { setVoiceStatus('Non ho capito. Riprova.'); return; }
        $('voice-text').value = text;
        onVoiceTextChange();
        setVoiceStatus("Trascrizione completata. Controlla e premi Conferma.");
      } catch (err) {
        if (st.session !== voiceSession) return;
        setVoiceStatus('Errore durante la trascrizione Gemini.');
      } finally {
        if (st.session === voiceSession) voiceBusy = false;
      }
    }

    function encodeWav(chunks, inRate) {
      let len = 0;
      chunks.forEach(c => len += c.length);
      const merged = new Float32Array(len);
      let o = 0;
      chunks.forEach(c => { merged.set(c, o); o += c.length; });

      const outRate = 16000;
      const ratio = inRate / outRate;
      const outLen = Math.floor(len / ratio);
      const pcm = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), len);
        let s = 0, n = 0;
        for (let j = start; j < end; j++) { s += merged[j]; n++; }
        const v = Math.max(-1, Math.min(1, n ? s / n : 0));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
      }

      const buf = new ArrayBuffer(44 + pcm.length * 2);
      const dv = new DataView(buf);
      const str = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
      str(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVE');
      str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
      str(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) dv.setInt16(44 + i * 2, pcm[i], true);
      return buf;
    }

    function arrayBufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
      return btoa(bin);
    }

    async function transcribeWithGemini(wavBuffer) {
      const b64 = arrayBufferToBase64(wavBuffer);
      const prompt = 'Trascrivi fedelmente in italiano questa registrazione vocale. Rispondi solo con la trascrizione.';
      for (const model of GEMINI_MODELS) {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(GEMINI_API_KEY), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'audio/wav', data: b64 } }] }],
            generationConfig: { temperature: 0 }
          })
        });
        if (!res.ok) continue;
        const data = await res.json();
        const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
        return parts.map(p => p.text || '').join('').trim().replace(/^["“«]+|["”»]+$/g, '').trim();
      }
      throw new Error('Gemini error');
    }

    function extractPhone(text) {
      const spokenRun = /\b(?:(?:zero|uno|due|tre|quattro|cinque|sei|sette|otto|nove)\s+){5,}(?:zero|uno|due|tre|quattro|cinque|sei|sette|otto|nove)\b/g;
      const t = text.replace(spokenRun, m => m.trim().split(/\s+/).map(w => DIGIT_WORDS[w]).join(' '));
      const m = t.match(/\+?\d[\d\s.\-]{6,}\d/);
      if (!m) return { phone: '', rest: t };
      return { phone: m[0].replace(/[\s.\-]/g, ''), rest: t.replace(m[0], ' ') };
    }

    function locationVariants(loc, all) {
      const full = loc.name.toLowerCase();
      const v = [full];
      const noThe = full.replace(/^the\s+/, '');
      if (noThe !== full) v.push(noThe);
      const first = noThe.split(/\s+/)[0];
      const unique = all.filter(l => l.name.toLowerCase().replace(/^the\s+/, '').split(/\s+/)[0] === first).length === 1;
      if (first.length >= 5 && unique && !v.includes(first)) v.push(first);
      return v;
    }

    function parseClientCommand(raw) {
      let text = ' ' + raw.toLowerCase().trim() + ' ';
      let notes = '';
      const nm = text.match(/\b(?:note|nota|annotazioni|annotazione)\b\s*[:,]?\s*(.+)$/);
      if (nm) { notes = capFirst(nm[1].trim()); text = text.slice(0, nm.index) + ' '; }

      const ph = extractPhone(text);
      const contact = ph.phone;
      text = ph.rest;

      const locations = getArtistLocations();
      let location = null;
      const candidates = [];
      locations.forEach(l => locationVariants(l, locations).forEach(v => candidates.push({ loc: l, v })));
      candidates.sort((a, b) => b.v.length - a.v.length);
      for (const c of candidates) {
        const idx = text.indexOf(c.v);
        if (idx !== -1) { location = c.loc; text = text.slice(0, idx) + ' ' + text.slice(idx + c.v.length); break; }
      }

      text = text.replace(/\b(?:nuovo|nuova)\s+(?:cliente|clienta)\b/g, ' ')
                 .replace(/\b(?:aggiungi|aggiungere|inserisci|inserire|metti|registra|crea)\b/g, ' ')
                 .replace(/\bcliente\b/g, ' ');

      const isContinuo = /\b(continu\w*|prosegu\w*|prosecuzione|ritocc\w*|seconda sessione|altra sessione)\b/.test(text);
      const isAsap = /\b(asap|prima possibile|urgente|urgenza|subito|in fretta|con urgenza)\b/.test(text);
      const isRelax = /\b(senza fretta|relax|con calma|tranquill\w*)\b/.test(text);
      text = text.replace(/\b(continu\w*|prosegu\w*|prosecuzione|ritocc\w*|seconda sessione|altra sessione|nuovo|nuova|asap|prima possibile|urgente|urgenza|subito|in fretta|con urgenza|senza fretta|relax|con calma|tranquill\w*)\b/g, ' ');

      let priority;
      if (isContinuo && isAsap) priority = '1';
      else if (!isContinuo && isAsap) priority = '2';
      else if (isContinuo) priority = '3';
      else priority = '4';
      const priorityDetected = isContinuo || isAsap || isRelax || /\bnuov[oa]\b/.test(raw.toLowerCase());

      let nameText = text
        .replace(/\b(?:numero|telefono|cellulare|tel|luogo|sede|presso|per|a|in|il|la|lo|con|di telefono|progetto|tatuaggio|tatuaggi|priorit[aà]|lista|attesa|d'attesa|waiting|the)\b/g, ' ')
        .replace(/[^\p{L}\s'’]/gu, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const name = capitalizeWords(nameText.split(' ').slice(0, 4).join(' '));

      return { kind: 'client', name, contact, location, priority, priorityDetected, notes };
    }

    function parseShoppingCommand(raw) {
      let t = ' ' + raw.toLowerCase().trim() + ' ';
      let mode = 'add';
      const rm = /^\s*(?:per favore\s+)?(?:togli|togliere|tolgo|rimuovi|rimuovere|elimina|eliminare|cancella|cancellare)\b/;
      if (rm.test(t)) { mode = 'remove'; t = t.replace(rm, ' '); }
      t = t.replace(/^\s*(?:per favore\s+)?(?:aggiungi|aggiungere|metti|mettere|inserisci|inserire|compra|comprare|prendi|dobbiamo comprare|bisogna comprare|ci servono|ci serve|mi servono|mi serve|servono|serve)\b/, ' ')
           .replace(/\b(?:alla|nella|in|sulla)\s+(?:la\s+)?lista(?:\s+della\s+spesa)?\b/g, ' ')
           .replace(/\b(?:dalla|nella)\s+lista(?:\s+della\s+spesa)?\b/g, ' ')
           .replace(/\bper favore\b/g, ' ');

      const parts = t.split(/\s*(?:,|;|\be\b|\bpoi\b|\banche\b|\binoltre\b)\s*/).map(s => s.trim()).filter(Boolean);
      const items = [];
      parts.forEach(p => {
        let qty = 1;
        let name = p;
        const m = p.match(/^(\d+|[a-zà-ù]+)\s+(.+)$/);
        if (m) {
          const n = /^\d+$/.test(m[1]) ? parseInt(m[1]) : NUM_WORDS[m[1]];
          if (n !== undefined && n > 0) { qty = Math.min(n, 999); name = m[2]; }
        }
        name = name.replace(/^(?:il|lo|la|i|gli|le|dei|delle|degli)\s+/, '').trim();
        if (name) items.push({ name: capFirst(name), qty });
      });

      return { kind: 'shopping', mode, items };
    }

    function onVoiceTextChange() {
      const raw = $('voice-text').value.trim();
      const preview = $('voice-preview');
      const confirmBtn = $('voice-confirm');
      parsedVoice = null;
      confirmBtn.disabled = true;

      if (!raw) { preview.innerHTML = ''; return; }

      if (voiceMode === 'client') {
        const p = parseClientCommand(raw);
        parsedVoice = p;
        const prioText = (p.location && p.location.isSinglePriority) ? 'Iscrizione evento (nessuna priorità)' : PRIORITY_LABELS[p.priority].text + (p.priorityDetected ? '' : ' (predefinito)');
        const row = (label, value, ok) => `<div class="flex gap-2"><span class="text-brand-muted w-16 shrink-0">${label}</span><span class="${ok ? 'text-white' : 'text-amber-400'}">${value}</span></div>`;
        preview.innerHTML =
          row('Nome', p.name ? escapeHtml(p.name) : 'non rilevato', !!p.name) +
          row('Telefono', p.contact ? escapeHtml(p.contact) : 'non rilevato', !!p.contact) +
          row('Luogo', p.location ? escapeHtml(p.location.name) : 'non rilevato', !!p.location) +
          row('Tipo', escapeHtml(prioText), true) +
          (p.notes ? row('Note', escapeHtml(p.notes), true) : '');
        confirmBtn.innerText = 'Apri modulo';
        confirmBtn.disabled = !p.name;
      } else {
        const p = parseShoppingCommand(raw);
        parsedVoice = p;
        if (!p.items.length) { preview.innerHTML = '<div class="text-amber-400">Nessun articolo riconosciuto.</div>'; return; }
        if (p.mode === 'add') {
          preview.innerHTML = '<div class="text-brand-muted mb-1">Verranno aggiunti:</div>' +
            p.items.map(i => `<div class="flex items-center gap-2"><span class="text-emerald-400 font-mono">+${i.qty}</span><span class="text-white">${escapeHtml(i.name)}</span></div>`).join('');
          confirmBtn.innerText = 'Aggiungi';
        } else {
          preview.innerHTML = '<div class="text-brand-muted mb-1">Verranno rimossi:</div>' +
            p.items.map(i => {
              const matches = findShoppingMatches(i.name);
              return `<div class="flex items-center gap-2"><span class="text-red-400 font-mono">−</span><span class="${matches.length ? 'text-white' : 'text-amber-400'}">${escapeHtml(i.name)}</span></div>`;
            }).join('');
          confirmBtn.innerText = 'Rimuovi';
        }
        confirmBtn.disabled = false;
      }
    }

    function findShoppingMatches(name) {
      const n = norm(name);
      if (!n) return [];
      return shoppingList.filter(i => { const x = norm(i.name); return x.includes(n) || n.includes(x); });
    }

    async function confirmVoice() {
      if (!parsedVoice) return;
      const p = parsedVoice;
      closeVoice();

      if (p.kind === 'client') {
        openModal(false);
        $('field-name').value = p.name;
        $('field-contact').value = p.contact;
        if (p.location) $('field-location').value = p.location.name;
        handleLocationChange();
        if (!(p.location && p.location.isSinglePriority)) $('field-priority').value = p.priority;
        $('field-notes').value = p.notes;
        showToast('Controlla i dati e premi "Salva Cliente"');
        return;
      }

      try {
        if (p.mode === 'add') {
          for (const it of p.items) await shopUpsert(it.name, it.qty);
          showToast(`Aggiunti ${p.items.length} articoli`);
        } else {
          const ids = new Set();
          p.items.forEach(it => findShoppingMatches(it.name).forEach(m => ids.add(m.id)));
          await shopRemoveMany([...ids]);
          showToast(ids.size ? `Rimossi ${ids.size} articoli` : 'Nessun articolo corrispondente');
        }
      } catch (e) {
        showToast('Errore nel salvataggio', 4000);
      }
    }

    document.addEventListener('touchstart', function () {}, { passive: true });

    let updateChecking = false;
    let lastUpdateCheck = 0;

    async function clearAppCaches() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) {}
    }

    function anyOverlayOpen() {
      return ['modal', 'locations-modal', 'voice-sheet'].some(id => !$(id).classList.contains('hidden'));
    }

    function showUpdateBanner(latest) {
      $('update-banner-text').innerText = 'Nuova versione ' + latest + ' disponibile';
      $('update-banner-btn').onclick = () => applyUpdate(latest, true);
      $('update-banner').classList.remove('hidden');
    }

    async function applyUpdate(latest, manual) {
      if (!manual && anyOverlayOpen()) { showUpdateBanner(latest); return; }
      try { sessionStorage.setItem('update_tried', latest); } catch (e) {}
      showToast('Aggiorno a ' + latest + '…', 1500);
      await clearAppCaches();
      setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(latest) + '&t=' + Date.now()), 400);
    }

    async function checkForUpdate(force) {
      const now = Date.now();
      if (updateChecking || (!force && now - lastUpdateCheck < 60000)) return;
      updateChecking = true;
      lastUpdateCheck = now;
      try {
        const res = await fetch(location.pathname + '?check=' + now, { cache: 'no-store' });
        if (!res.ok) throw new Error('http ' + res.status);
        const html = await res.text();
        const m = html.match(/APP_VERSION = '(v\d+(?:\.\d+)*)'/);
        const latest = m && m[1];
        if (latest && latest !== APP_VERSION) {
          let tried = null;
          try { tried = sessionStorage.getItem('update_tried'); } catch (e) {}
          if (tried === latest) showUpdateBanner(latest);
          else applyUpdate(latest, false);
        } else if (force) {
          showToast('Sei aggiornato (' + APP_VERSION + ')');
        }
      } catch (e) {
        if (force) showToast("Impossibile controllare aggiornamenti", 3500);
      } finally {
        updateChecking = false;
      }
    }

    function forceUpdate() {
      showToast('Controllo aggiornamenti…', 1200);
      checkForUpdate(true);
    }

    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(false); });
    window.addEventListener('pageshow', () => checkForUpdate(false));
    window.addEventListener('online', () => checkForUpdate(false));

    document.addEventListener('pointerdown', e => {
      const el = e.target.closest && e.target.closest('.logo-hover-effect');
      if (!el) return;
      el.classList.add('logo-playing');
      clearTimeout(el._logoTimer);
      el._logoTimer = setTimeout(() => el.classList.remove('logo-playing'), 1600);
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!$('voice-sheet').classList.contains('hidden')) closeVoice();
      else if (!$('locations-modal').classList.contains('hidden')) closeManageLocationsModal();
      else if (!$('modal').classList.contains('hidden')) closeModal();
    });

    document.addEventListener("DOMContentLoaded", () => {
      buildArtistButtons();
      $('app-version').innerText = APP_VERSION;
      setTimeout(() => checkForUpdate(false), 1500);
      renderHomeCounts();
      renderShoppingList();
      refreshIcons();
    });
  </script>
</body>
</html>
